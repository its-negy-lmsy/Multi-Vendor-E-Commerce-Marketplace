openapi: 3.1.0
info:
  title: Common Goods Marketplace API
  version: 1.0.0
  description: >-
    Versioned REST API. MongoDB is authoritative. Responses use {error:{code,message,details?}}
    for failures. Authentication endpoints are rate limited to 20 requests per 15 minutes per IP.
    `POST /checkout` requires an Idempotency-Key. Payments can use the development mock or
    Razorpay Route. The provider webhook validates the raw-body HMAC and captured amount.
servers:
  - url: http://localhost:4000/api/v1
paths:
  /health/live:
    get:
      summary: Process liveness
      responses:
        '200': { description: Process is serving requests }
  /health/ready:
    get:
      summary: Dependency readiness
      responses:
        '200': { description: MongoDB connected }
        '503': { description: Required database unavailable }
  /auth/register:
    post:
      summary: Register a customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                email: { type: string, format: email }
                password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        '200': { description: Access token and customer identity; refresh token is HttpOnly cookie }
        '400': { description: Validation error }
        '409': { description: Email is already registered }
  /auth/login:
    post:
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: Access token and identity }
        '401': { description: Invalid credentials }
  /auth/refresh:
    post:
      summary: Rotate the HttpOnly refresh session
      responses:
        '200': { description: New access token and rotated refresh cookie }
        '401': { description: Refresh session is missing or invalid }
  /auth/logout:
    post:
      security: [{ bearerAuth: [] }]
      summary: Revoke refresh session
      responses:
        '204': { description: Session revoked }
  /auth/me:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read authenticated identity
      responses:
        '200': { description: Identity and principal role }
        '401': { description: Missing or invalid access token }
  /admin/ping:
    get:
      security: [{ bearerAuth: [] }]
      summary: Role-protected admin example
      responses:
        '200': { description: Administrator role confirmed }
        '403': { description: Principal lacks administrator role }
  /products:
    get:
      summary: List searchable published products
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 100 } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 48, default: 12 } }
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: minPrice, description: Integer paise, schema: { type: integer, minimum: 0 } }
        - { in: query, name: maxPrice, description: Integer paise, schema: { type: integer, minimum: 0 } }
        - { in: query, name: minRating, schema: { type: number, minimum: 0, maximum: 5 } }
        - { in: query, name: vendorId, schema: { type: string } }
        - { in: query, name: inStock, schema: { type: boolean } }
        - { in: query, name: sort, schema: { type: string, enum: [relevance, price_asc, price_desc, newest, rating] } }
      responses:
        '200': { description: Product page; searchEngine identifies MongoDB fallback }
  /products/{id}:
    get:
      summary: Read a published product
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Product detail }
        '404': { description: Product not found }
  /users/me/addresses:
    get:
      security: [{ bearerAuth: [] }]
      summary: List the signed-in customer's saved addresses
      responses:
        '200': { description: Customer-owned addresses }
    post:
      security: [{ bearerAuth: [] }]
      summary: Save a shipping address
      responses:
        '201': { description: Address stored for the current customer }
  /cart:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read persisted cart with Redis cache when available
      responses:
        '200': { description: Cart; source identifies Redis or MongoDB }
    put:
      security: [{ bearerAuth: [] }]
      summary: Replace the current customer's cart quantities
      responses:
        '200': { description: Cart persisted to MongoDB and cached when possible }
        '409': { description: Product unavailable or stock exceeded }
  /checkout:
    post:
      security: [{ bearerAuth: [] }]
      summary: Create an idempotent multi-vendor order and payment attempt
      parameters:
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
      responses:
        '201': { description: Order in PAYMENT_PENDING state }
        '400': { description: Address or request validation failure }
        '409': { description: Stock or product conflict }
  /payments/mock/webhook:
    post:
      summary: Development-only HMAC-signed mock payment event
      parameters:
        - { in: header, name: X-Mock-Signature, required: true, schema: { type: string } }
      responses:
        '200': { description: Event processed idempotently }
        '401': { description: Invalid signature }
        '404': { description: Disabled outside the local mock provider }
  /payments/razorpay/webhook:
    post:
      summary: Verify a Razorpay Route captured payment event
      parameters:
        - { in: header, name: X-Razorpay-Signature, required: true, schema: { type: string } }
        - { in: header, name: X-Razorpay-Event-Id, required: false, schema: { type: string } }
      responses:
        '200': { description: Captured payment processed idempotently; other signed event types acknowledged and ignored }
        '400': { description: Invalid event payload or captured amount mismatch }
        '401': { description: Invalid signature }
        '404': { description: Payment attempt not found or provider disabled }
  /orders:
    get:
      security: [{ bearerAuth: [] }]
      summary: List current customer's orders
      responses:
        '200': { description: Orders owned by the principal }
  /orders/{id}:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read an order owned by the current customer
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        '200': { description: Order detail }
        '404': { description: Order not found }
  /vendors/application:
    post:
      security: [{ bearerAuth: [] }]
      summary: Submit customer-owned vendor application
      responses:
        '201': { description: Application awaits admin review }
        '409': { description: Application already exists }
  /admin/vendors/{id}/razorpay-linked-account:
    patch:
      security: [{ bearerAuth: [] }]
      summary: Set an approved vendor's Route linked-account reference (admin only)
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [linkedAccountId]
              properties:
                linkedAccountId: { type: string, pattern: '^acc_[A-Za-z0-9]+$' }
      responses:
        '200': { description: Updated reference; the provider account ID is not returned }
        '403': { description: Admin role required }
        '404': { description: Approved vendor profile not found }
  /vendors/me:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read the current vendor storefront profile
      responses:
        '200': { description: Vendor profile }
  /vendor/products:
    get:
      security: [{ bearerAuth: [] }]
      summary: List current vendor's products
      responses:
        '200': { description: Vendor-owned products }
    post:
      security: [{ bearerAuth: [] }]
      summary: Create a product pending moderation
      responses:
        '201': { description: Product pending publication }
  /vendor/products/{id}:
    patch:
      security: [{ bearerAuth: [] }]
      summary: Update an owned product and return it to pending moderation
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        '200': { description: Updated product }
        '404': { description: Product not owned or not found }
    delete:
      security: [{ bearerAuth: [] }]
      summary: Archive an owned product
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        '204': { description: Product archived }
  /vendor/orders:
    get:
      security: [{ bearerAuth: [] }]
      summary: List only this vendor's order items without buyer address details
      responses:
        '200': { description: Vendor-scoped fulfillment groups }
  /vendor/orders/{orderId}/items/{itemId}/fulfillment:
    patch:
      security: [{ bearerAuth: [] }]
      summary: Advance an owned vendor order item from unfulfilled to packed to shipped
      parameters:
        - { in: path, name: orderId, required: true, schema: { type: string } }
        - { in: path, name: itemId, required: true, schema: { type: string } }
      responses:
        '200': { description: Vendor-owned fulfillment state updated }
        '404': { description: Order item is not owned by the vendor }
        '409': { description: Invalid fulfillment state transition }
  /vendor/ledger:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read payable vendor ledger
      responses:
        '200': { description: Ledger balance explicitly distinguished from settlement }
  /admin/vendors:
    get:
      security: [{ bearerAuth: [] }]
      summary: List vendor applications by status
      responses:
        '200': { description: Admin vendor review queue }
  /admin/vendors/{id}/status:
    patch:
      security: [{ bearerAuth: [] }]
      summary: Approve, reject or suspend a vendor; action is audited
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        '200': { description: Reviewed vendor profile }
        '404': { description: Application not found }
  /admin/products/{id}/status:
    patch:
      security: [{ bearerAuth: [] }]
      summary: Publish or archive a product; action is audited and search outbox is updated
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        '200': { description: Updated moderation status }
  /admin/analytics/summary:
    get:
      security: [{ bearerAuth: [] }]
      summary: Aggregate paid GMV, commission, vendor sales and top products
      responses:
        '200': { description: Metrics with included definitions }
  /admin/audit-logs:
    get:
      security: [{ bearerAuth: [] }]
      summary: List recent administrative audit events
      responses:
        '200': { description: Latest 100 audit events }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
